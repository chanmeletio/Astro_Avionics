name: Firmware Build & Test

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-build.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-build.yml'
  workflow_dispatch:

jobs:
  host-unit-tests:
    name: Host Native Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Host Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++

      - name: Configure CMake for Host Tests
        run: |
          cmake -B firmware/build-tests -S firmware -DBUILD_TESTS=ON -GNinja

      - name: Compile Host Unit Tests
        run: |
          cmake --build firmware/build-tests

      - name: Execute Unit Tests
        run: |
          cd firmware/build-tests
          ctest --output-on-failure

  arm-cross-compile:
    name: Cross-Compile STM32F405 Target Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install ARM Embedded Toolchain & Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi cmake ninja-build

      - name: Configure Cross-Compilation Build
        run: |
          cmake -B firmware/build-target -S firmware \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake \
            -GNinja

      - name: Build Firmware (ELF, HEX, BIN)
        run: |
          cmake --build firmware/build-target

      - name: Print Firmware Memory Footprint
        run: |
          arm-none-eabi-size firmware/build-target/avionics.elf || true

      - name: Upload Target Binaries
        uses: actions/upload-artifact@v4
        with:
          name: avionics-firmware-binaries
          path: |
            firmware/build-target/avionics.elf
            firmware/build-target/avionics.hex
            firmware/build-target/avionics.bin
            firmware/build-target/avionics.map
          retention-days: 14
