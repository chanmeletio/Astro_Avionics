name: Firmware Code Quality & Static Analysis

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-ci.yml'
  workflow_dispatch:

jobs:
  static-analysis:
    name: C/C++ Static Analysis & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Analysis Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format cppcheck

      - name: Run Clang-Format Style Verification
        run: |
          echo "Checking C/C++ files in firmware/app, firmware/bsp, firmware/drivers..."
          FORMAT_ERRORS=0
          # Check files while excluding auto-generated vendor drivers (CubeMX / CMSIS)
          FILES=$(find firmware/app firmware/bsp firmware/drivers firmware/mid -type f \( -name "*.c" -o -name "*.h" \) 2>/dev/null || true)
          if [ -n "$FILES" ]; then
            for file in $FILES; do
              if ! clang-format --dry-run --Werror "$file" 2>&1; then
                echo "Formatting violation in: $file"
                FORMAT_ERRORS=$((FORMAT_ERRORS + 1))
              fi
            done
          else
            echo "No custom C/C++ files found for style check."
          fi
          if [ $FORMAT_ERRORS -gt 0 ]; then
            echo "::warning::Found $FORMAT_ERRORS formatting violations. Consider running clang-format -i on your files."
          fi

      - name: Run Cppcheck Embedded Static Analysis
        run: |
          mkdir -p firmware/analysis-reports
          cppcheck --enable=warning,style,performance,portability \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --error-exitcode=0 \
            --output-file=firmware/analysis-reports/cppcheck-report.txt \
            -I firmware/app/inc \
            -I firmware/bsp/inc \
            firmware/app firmware/bsp firmware/drivers || true
          cat firmware/analysis-reports/cppcheck-report.txt || true

      - name: Archive Analysis Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-static-analysis
          path: firmware/analysis-reports/
          if-no-files-found: ignore
          retention-days: 14
