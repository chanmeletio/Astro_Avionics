name: Firmware CI Checks

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-ci.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-ci.yml'
  workflow_dispatch:

jobs:
  static-analysis:
    name: Clang-Format & Static Analysis (Cppcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Analysis Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format cppcheck

      - name: Run Clang-Format Lint Check
        run: |
          echo "Checking C/C++ formatting for firmware/app, firmware/bsp, firmware/drivers..."
          find firmware/app firmware/bsp firmware/drivers firmware/mid -type f \( -name "*.c" -o -name "*.h" \) \
            -exec clang-format --dry-run --Werror {} + || echo "Formatting check finished"

      - name: Run Cppcheck Static Analysis
        run: |
          cppcheck --enable=warning,performance,portability \
            --error-exitcode=0 \
            --inline-suppr \
            -I firmware/app/inc \
            -I firmware/bsp/inc \
            -I firmware/mid/comms \
            -I firmware/mid/ringbuffer \
            firmware/app/src firmware/bsp/src firmware/mid/

  compiler-warnings:
    name: Strict Compiler Warnings (-Wall -Wextra)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++

      - name: Build with Strict Warnings
        run: |
          cmake -B firmware/build-warnings -S firmware \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Werror=implicit-function-declaration" \
            -DBUILD_TESTS=ON \
            -GNinja
          cmake --build firmware/build-warnings
